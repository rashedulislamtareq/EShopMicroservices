apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Turns the Elastic APM trace id in each log line into a link to the trace in Kibana APM
        - name: TraceID
          matcherRegex: '"ElasticApmTraceId":"(\w+)"'
          url: 'http://localhost:5601/app/apm/link-to/trace/$${__value.raw}'
          urlDisplayLabel: View trace in Kibana APM
